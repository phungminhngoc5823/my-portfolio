# Build the Vite app and deploy the production bundle to GitHub Pages.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Validate production build
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/my-portfolio/assets/' dist/index.html
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "Uncompiled Vite source found in production HTML" >&2
            exit 1
          fi

      - name: Build VI/EN/ZH portfolio
        run: |
          python3 scripts/build_pages_i18n.py dist
          node i18n/build_i18n.js dist/site-untranslated.html dist/index.html
          rm dist/site-untranslated.html

      - name: Validate language versions
        run: |
          grep -q 'id="lang-switch"' dist/index.html
          grep -q 'id="app-vi"' dist/index.html
          grep -q 'id="app-en"' dist/index.html
          grep -q 'id="app-zh"' dist/index.html
          grep -q '/my-portfolio/assets/' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Use a distinct name on each attempt to support safe workflow re-runs.
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
